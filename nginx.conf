server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Emit relative redirects. nginx only sees plain HTTP behind Caddy, so an
  # absolute redirect would send visitors to http:// and lose the TLS scheme.
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml application/xml;
  gzip_min_length 512;

  # Real 404s get the branded page (noindex) instead of nginx's default.
  error_page 404 /404.html;
  location = /404.html { internal; }

  # Liveness probe — served from memory, no filesystem hit, not in the access
  # log. Used by the container HEALTHCHECK and deploy/scripts/health.sh.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # The site used to live at github.io/debtbook-legal/ — keep those paths alive
  # so old links and the GitHub Pages sitemap don't 404 on the new domain.
  location /debtbook-legal/ {
    rewrite ^/debtbook-legal/(.*)$ /$1 permanent;
  }

  # /privacy-policy and /privacy-policy.html both resolve.
  location / { try_files $uri $uri.html $uri/ =404; }

  location /screenshots-v2/ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.(png|jpg|jpeg|svg|ico|webp)$ { expires 30d; add_header Cache-Control "public"; }
}
